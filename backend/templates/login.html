<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            background: rgba(255,255,255,0.15);

            backdrop-filter: blur(10px);

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 8px 32px rgba(0,0,0,0.2);

            color: white;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 10px;

            font-size: 16px;
        }

        .btn-login {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #28a745;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn-login:hover {
            background: #218838;
            transform: scale(1.02);
        }

        .error-message {
            margin-top: 15px;
            color: #ffb3b3;
            text-align: center;
            font-weight: bold;
        }

        .system-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 18px;
            opacity: 0.9;
        }

        .info-box {
            margin-top: 25px;

            background: rgba(255,255,255,0.1);

            padding: 15px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.6;
        }

        @media (max-width: 500px) {
            .login-container {
                margin: 20px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="system-title">
            📦 Sistema de Estoque
        </div>

        <h1>🔐 Login</h1>

        <form id="loginForm">

            <div class="form-group">
                <label>Usuário</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Digite o usuário"
                    required
                >
            </div>

            <div class="form-group">
                <label>Senha</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite a senha"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Entrar
            </button>

        </form>

        <div id="errorMessage" class="error-message"></div>


    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
